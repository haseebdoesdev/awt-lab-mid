# Full stack: MongoDB + API (Express/Socket.IO) + client (nginx).
#   cp .env.example .env && docker compose up --build
#   → http://localhost:8080
name: pulse-chat

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/pulse
      CLIENT_ORIGIN: http://localhost:${APP_PORT:-8080}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env (see .env.example)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: 1
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongo-data:
