# MongoDB only, exposed on localhost, for local development with `npm run dev`.
#   docker compose -f docker-compose.dev.yml up -d
name: pulse-chat-dev

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-dev-data:/data/db

volumes:
  mongo-dev-data:
